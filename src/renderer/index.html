<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Overlay</title>
    <!--
      Strict CSP for the overlay:
      - scripts/styles/images from the bundle itself
      - data:/blob: images (captured screenshots)
      - https: connections (AI API) + ws: (vite HMR in dev only)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
